<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Segoe UI',sans-serif; }
  #actor { position:absolute; bottom:0; left:0; width:220px; display:flex; flex-direction:column;
           align-items:center; pointer-events:none; will-change:transform; }
  #bubble { display:none; pointer-events:auto; background:#fff; border:3px solid #222; border-radius:16px;
            padding:8px 12px; text-align:center; font-weight:700; font-size:14px; margin-bottom:6px; max-width:210px; }
  #btns { display:none; }
  #bubble button { margin:6px 4px 0; padding:5px 10px; border:2px solid #222; border-radius:10px;
                   background:#ffd400; font-weight:700; cursor:pointer; }
  #char { pointer-events:auto; user-select:none; transform-origin:50% 100%; }
  #actor.sit #char { pointer-events:none; }  /* sitting never blocks clicks */

  /* countdown tag above his head while a Pomodoro runs */
  #tag { display:none; background:#fff; border:2px solid #222; border-radius:12px; padding:2px 8px;
         font-weight:700; font-size:13px; margin-bottom:4px; }

  /* round icons that "shoot up" when you hover on him */
  #menu { display:none; gap:8px; margin-bottom:6px; pointer-events:auto; }
  .icon { width:44px; height:44px; border-radius:50%; border:3px solid #222; background:#fff;
          font-size:22px; cursor:pointer; padding:0; }
  .icon:hover { background:#ffd400; }
  #menu .icon { animation: shoot .35s cubic-bezier(.2,.9,.3,1.2) both; }
  #menu .icon:nth-child(2) { animation-delay: .07s; }
  #menu .icon:nth-child(3) { animation-delay: .14s; }
  @keyframes shoot { from { transform: translateY(80px) scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }

  /* panels (Pomodoro, System) */
  .pnl { display:none; pointer-events:auto; background:#fff; border:3px solid #222; border-radius:16px;
         padding:10px 12px; font-weight:700; font-size:14px; margin-bottom:6px; width:196px; text-align:center; }
  .pnl .row { display:flex; align-items:center; justify-content:center; gap:6px; margin:6px 0; }
  .pnl .line { display:flex; justify-content:space-between; margin:6px 0; }
  .pnl button { padding:4px 9px; border:2px solid #222; border-radius:10px; background:#ffd400;
                font-weight:700; cursor:pointer; }
  .pnl .hint { font-size:11px; font-weight:600; color:#555; }
  #pRun { display:none; }
</style>
</head>
<body>
<div id="actor">
  <div id="tag"></div>
  <div id="panel" class="pnl">
    <div>⏱️ Pomodoro</div>
    <div id="pSetup">
      <div class="row">📚 Study <button id="sMinus">−</button><span id="sVal">25</span><button id="sPlus">+</button> min</div>
      <div class="row">☕ Break <button id="bMinus">−</button><span id="bVal">5</span><button id="bPlus">+</button> min</div>
      <div class="hint">Break 0 = no break</div>
      <div class="row"><button id="pStart">START</button><button id="pCancel">Cancel</button></div>
    </div>
    <div id="pRun">
      <div id="pLeft" style="margin:8px 0"></div>
      <div class="row"><button id="pStop">STOP timer</button><button id="pClose">Close</button></div>
    </div>
  </div>
  <div id="sysPanel" class="pnl">
    <div>📊 System</div>
    <div class="line"><span>🔋 Battery</span><span id="sBatt">...</span></div>
    <div class="line"><span>🧠 RAM</span><span id="sRam">...</span></div>
    <div class="line"><span>⚙️ CPU</span><span id="sCpu">...</span></div>
    <div class="row"><button id="sysClose">Close</button></div>
  </div>
  <div id="bubble"><div id="msg"></div><div id="btns">
    <button id="yes">YES</button><button id="later">Remind me later</button></div></div>
  <div id="menu">
    <button class="icon" id="iPomo" title="Pomodoro timer">⏱️</button>
    <button class="icon" id="iSys" title="System stats">📊</button>
    <button class="icon" id="iStreak" title="Check GitHub streak">🔥</button>
  </div>
  <img id="char" src="assets/front.png" draggable="false">
</div>

<script>
// ================= CONFIG (change things here) =================
const TEST_MODE = false;                      // true = reminders every 12 s (testing) | false = normal
const REMIND_MIN = TEST_MODE ? 0.2 : 20;      // normal: every 20 min (use 10 for 10 min)
const SNOOZE_MIN = TEST_MODE ? 0.2 : 5;       // "later" / ignored => ask again after this
const STAY_MS = 90000;                        // how long a reminder waits for an answer
const CHAR_H = 130;                           // buddy height in px (smaller = smaller buddy)
const RUN_SPEED = 450;                        // px/sec running (lower = slower)
const WANDER_SPEED = 300;                     // px/sec wandering while dancing
const SIT_FROM_RIGHT_PX = 235;                // sitting spot, distance from right edge (bigger = more left)
const AW = 220;                               // actor width (matches CSS)

// --- taskbar ---
const TASKBAR_AUTOHIDE = true;                // true = your taskbar auto-hides | false = always visible
const TASKBAR_H = 48;                         // taskbar height when it pops up (same as in main.js)
const SIT_DROP = 40;                          // taskbar shown: legs hang this far over it. He rises (TASKBAR_H - SIT_DROP) px.
                                              //   keep this BELOW TASKBAR_H, bigger = lower & rises less
const SIT_DROP_HIDDEN = 25;                    // taskbar hidden: 0 = feet rest on the screen bottom

// --- Pomodoro ---
const POMO_SEC_PER_MIN = 60;                  // 60 = real minutes | set to 1 to TEST (1 "minute" = 1 second)
const HOVER_MS = 400;                         // hover on him this long to show the icons
const ALARM_MS = 5000;                        // alarm sound + dance length

// --- battery warning ---
const LOW_BATT = 0.30;                        // warn BELOW 30% (use 1.0 to TEST while unplugged)
const BATT_REPEAT_MIN = 3;                    // warn again every 3 minutes while it stays low

const $ = id => document.getElementById(id);
const actor = $('actor'), ch = $('char'), bubble = $('bubble'), msg = $('msg'), btns = $('btns');
const tag = $('tag'), menu = $('menu'), panel = $('panel'), sysPanel = $('sysPanel');
ch.style.height = CHAR_H + 'px';
const W = () => window.innerWidth;
const TB = () => Math.max(0, screen.height - screen.availHeight);          // taskbar height (always-visible mode)
const sitX = () => W() - SIT_FROM_RIGHT_PX / window.devicePixelRatio - AW / 2;

// ---------- poses (missing files fall back to front.png) ----------
// dance poses, in one place. Add new names here as you create the images.
const DANCE = [
  'hand_up','hands_up', 'dance_squat','dance_twist',
  'leg_up', 'dance_clap', 'disco', 'back'
  // later: 'dance_wide', 'dance_lunge', 'dance_shoulder', 'dance_kick', 'dance_spin', ...
];
const loaded = new Set(['front', 'back']);
[...DANCE, 'sit','cup_hold','cup_drink','thumbs_up','run1','run2','think','clock_hold','archer','sleep_eyes','sleep_laptop','sleep_bed'].forEach(n => {
  const i = new Image(); i.onload = () => loaded.add(n); i.src = `assets/${n}.png`;
});
let cur = '';
function setImg(n) { if (!loaded.has(n)) n = 'front'; if (n !== cur) { cur = n; ch.src = `assets/${n}.png`; } }

// ---------- click-through ----------
// The window ignores the mouse by default. We turn clicks ON only while the mouse is over
// a button/panel (see syncClick below), so he never blocks your normal clicks.
let ctState = null;
function ct(on) { if (on !== ctState) { ctState = on; window.api.clickThrough(on); } }
ct(true);

// ---------- state ----------
let x = sitX(), target = null, speed = 0, face = 1, resolveMove = null;
let state = 'sit', mode = 'idle', prio = 0, token = 0, hidden = false, tbShown = false;
let answer = null, remindTimer = null, musicEnabled = true, musicOn = false, musicDismissed = false;
let energy = 0, loudSince = null, silentSince = null;
let forceDance = false;                          // dance even without music (alarm)
let cx = null, cy = null;                        // mouse position inside this window (sent by main.js)
let menuShown = false, panelOpen = false, hoverSince = null, leaveSince = null;
let pomo = null;                                 // running timer: { phase:'study'|'break', endAt, breakMin }
let studyMin = 25, breakMin = 5;
let sysTimer = null, batt = null, lastBattWarn = 0;

const w = (ms, ok) => new Promise((res, rej) => setTimeout(() => (ok() ? res() : rej()), ms));
function moveTo(tx, sp, ok) {
  return new Promise((res, rej) => {
    target = tx; speed = sp; state = 'run'; face = tx > x ? 1 : -1;
    resolveMove = () => (ok() ? res() : rej());
  });
}
function say(t, withBtns = false) {
  bubble.style.display = t ? 'block' : 'none';
  msg.textContent = t || '';
  btns.style.display = withBtns ? 'block' : 'none';
}
function labels(a, b) { $('yes').textContent = a; $('later').textContent = b; }   // bubble button names
function flash(t) {                               // short message while idle (e.g. music on/off)
  if (mode !== 'idle') return;
  say(t);
  setTimeout(() => { if (mode === 'idle') say(null); }, 1800);
}
function reset() {
  target = null; state = 'sit'; mode = 'idle'; prio = 0; x = sitX();
  forceDance = false; stopAlarm(); say(null);
}

// ================= ALARM SOUND =================
let alarmAudio = null, beepTimer = null, beepCtx = null;
function beepAlarm() {                           // fallback if assets/alarm.mp3 is missing
  if (beepTimer) return;
  beepCtx = beepCtx || new AudioContext();
  const beep = () => {
    const o = beepCtx.createOscillator(), g = beepCtx.createGain();
    o.frequency.value = 880; g.gain.value = 0.2;
    o.connect(g); g.connect(beepCtx.destination);
    o.start(); o.stop(beepCtx.currentTime + 0.2);
  };
  beep(); beepTimer = setInterval(beep, 500);
}
function beepOnce(times = 3) {                   // a few short beeps (low battery)
  beepCtx = beepCtx || new AudioContext();
  beepCtx.resume();
  for (let i = 0; i < times; i++) {
    const o = beepCtx.createOscillator(), g = beepCtx.createGain();
    o.frequency.value = 880; g.gain.value = 0.2;
    o.connect(g); g.connect(beepCtx.destination);
    const t0 = beepCtx.currentTime + i * 0.3;
    o.start(t0); o.stop(t0 + 0.15);
  }
}
const SLEEP_MSGS = [
  "12 AM Karthik 🌙 Laptop off, sleep time!",
  "Your eyes must be red by now 👀 Close the screen",
  "Eyes burning? 🔥 That blue light is killing your sleep",
  "Bro go sleep 😠 Tomorrow's you needs this rest",
  "You'll be a zombie in class tomorrow 🧟",
  "Even I'm sleepy 😴 zzz... go to bed!",
  "Your pillow misses you 🛏️",
  "SLEEP. NOW. 🚨 I'm not leaving!"
];
function sleepChime(level) {                     // soft bell -> louder, faster alert
  beepCtx = beepCtx || new AudioContext(); beepCtx.resume();
  const notes = level < 2 ? [523, 659] : level < 4 ? [523, 659, 784] : [880, 660, 880, 660];
  const vol = Math.min(0.08 + level * 0.04, 0.35);
  notes.forEach((f, i) => {
    const o = beepCtx.createOscillator(), g = beepCtx.createGain();
    const t0 = beepCtx.currentTime + i * 0.35;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    o.connect(g); g.connect(beepCtx.destination);
    o.start(t0); o.stop(t0 + 0.65);
  });
}
function playAlarm() {
  stopAlarm();
  const a = new Audio('assets/alarm.mp3');
  a.loop = true; alarmAudio = a;
  a.addEventListener('error', beepAlarm, { once: true });
  a.play().catch(beepAlarm);
}
function stopAlarm() {
  if (alarmAudio) { alarmAudio.pause(); alarmAudio = null; }
  if (beepTimer) { clearInterval(beepTimer); beepTimer = null; }
}

// ================= HOVER MENU + PANELS =================
// Hover on him => archer pose ('aim') and the icons shoot up.
function showMenu() { menuShown = true; menu.style.display = 'flex'; state = 'aim'; }
function hideMenu() {
  if (!menuShown) return;
  menuShown = false; menu.style.display = 'none';
  if (state === 'aim') state = 'sit';
}
function openPanel() {                            // Pomodoro: he holds the clock while you set the timer
  hideMenu();
  panelOpen = true; mode = 'pomo'; prio = 2; state = 'holdclock';
  renderPanel(); panel.style.display = 'block';
}
function closePanel() {
  if (!panelOpen) return;
  panelOpen = false; panel.style.display = 'none'; sysPanel.style.display = 'none';
  clearInterval(sysTimer);
  if (mode === 'pomo' || mode === 'sys') { mode = 'idle'; prio = 0; state = 'sit'; }
}
const fmt = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function renderPanel() {
  const running = !!pomo;
  $('pSetup').style.display = running ? 'none' : 'block';
  $('pRun').style.display = running ? 'block' : 'none';
  $('sVal').textContent = studyMin; $('bVal').textContent = breakMin;
  if (running) $('pLeft').textContent = (pomo.phase === 'study' ? '📚 ' : '☕ ') + fmt(pomo.endAt - Date.now()) + ' left';
}
$('iPomo').onclick = () => { if (mode === 'idle') openPanel(); };
$('sMinus').onclick = () => { studyMin = Math.max(5, studyMin - 5); renderPanel(); };
$('sPlus').onclick  = () => { studyMin = Math.min(180, studyMin + 5); renderPanel(); };
$('bMinus').onclick = () => { breakMin = Math.max(0, breakMin - 5); renderPanel(); };
$('bPlus').onclick  = () => { breakMin = Math.min(60, breakMin + 5); renderPanel(); };
$('pStart').onclick = () => {
  pomo = { phase: 'study', endAt: Date.now() + studyMin * POMO_SEC_PER_MIN * 1000, breakMin };
  closePanel();                                   // he sits as usual, the tag shows the countdown
};
$('pCancel').onclick = closePanel;
$('pClose').onclick = closePanel;
$('pStop').onclick = () => { pomo = null; closePanel(); };

// ---------- System panel: battery (from the browser), RAM + CPU (from main.js) ----------
if (navigator.getBattery) navigator.getBattery().then(b => { batt = b; }).catch(() => {});
const battText = () => batt ? Math.round(batt.level * 100) + '%' + (batt.charging ? ' (charging)' : '') : 'n/a';
async function refreshSys() {
  try {
    const s = await window.api.getStats();
    $('sRam').textContent = s.ramUsedGB.toFixed(1) + ' / ' + s.ramTotalGB.toFixed(1) + ' GB';
    $('sCpu').textContent = s.cpu + '%';
  } catch (e) { $('sRam').textContent = 'n/a'; $('sCpu').textContent = 'n/a'; }
  $('sBatt').textContent = battText();
}
function openSys() {
  hideMenu();
  panelOpen = true; mode = 'sys'; prio = 2; state = 'think';
  sysPanel.style.display = 'block';
  refreshSys(); sysTimer = setInterval(refreshSys, 2000);
}
$('iSys').onclick = () => { if (mode === 'idle') openSys(); };
$('sysClose').onclick = closePanel;

// ================= SCENE STARTER =================
const ALWAYS = ['remind', 'alarm', 'battery','sleep'];    // these may appear even while he is hidden
function start(name, p, fn) {
  if (hidden && !ALWAYS.includes(name)) return false;
  if (mode !== 'idle' && p <= prio) return false;    // only higher priority can interrupt
  closePanel(); hideMenu();
  const my = ++token; mode = name; prio = p;
  fn(() => my === token).then(() => { if (my === token) reset(); }).catch(() => {});
  return true;
}
function dismissNow() {
  hideMenu();
  if (mode === 'pomo' || mode === 'sys') { closePanel(); return; }
  if ((mode === 'remind' || mode === 'streak') && answer) { answer(mode === 'remind' ? 'later' : 'timeout'); return; }
  if (mode === 'music') { musicDismissed = true; return; }   // scene sees the flag and goes back to sit
  if (mode !== 'idle') { token++; reset(); }
}

// ================= SCENES (all inside the small taskbar strip) =================
async function greet(ok) {                       // run to the far left end, wave, run back and sit
  await moveTo(10, RUN_SPEED, ok);
  state = 'wave'; say('Hey bro! 👋'); await w(2200, ok); say(null);
  await moveTo(sitX(), RUN_SPEED, ok);
}

async function remind(ok) {                      // water reminder: cup + sipping
  await moveTo(W() * 0.5 - AW / 2, RUN_SPEED, ok);
  labels('YES', 'Remind me later');
  state = 'cup'; say('Hey Karthik! Time for water 💧', true);
  const a = await Promise.race([new Promise(r => (answer = r)), w(STAY_MS, ok).then(() => 'timeout')]);
  answer = null; say(null);
  if (a === 'yes') { state = 'thumb'; await w(1800, ok); scheduleRemind(REMIND_MIN); }
  else scheduleRemind(SNOOZE_MIN);
  await moveTo(sitX(), RUN_SPEED, ok);
}

async function streak(ok) {                      // streak guard: no GitHub push today yet
  await moveTo(W() * 0.5 - AW / 2, RUN_SPEED, ok);
  labels('On it 👍', 'Skip today');
  state = 'think'; say('No commit today yet 🤔 Push something!', true);
  const a = await Promise.race([new Promise(r => (answer = r)), w(STAY_MS, ok).then(() => 'timeout')]);
  answer = null; say(null); labels('YES', 'Remind me later');
  if (a === 'later') window.api.streakSkip();    // "Skip today": main.js stops asking until tomorrow
  await moveTo(sitX(), RUN_SPEED, ok);           // "On it" / ignored: main.js asks again in 30 min
}

async function notice(ok, text, pose, ms = 4500) {   // run to the middle, show a short message, go back
  await moveTo(W() * 0.5 - AW / 2, RUN_SPEED, ok);
  state = pose; say(text); await w(ms, ok); say(null);
  await moveTo(sitX(), RUN_SPEED, ok);
}
async function sleepScene(ok, level) {           // eyes burning -> close laptop -> bed
  await moveTo(W() * 0.5 - AW / 2, RUN_SPEED, ok);
  sleepChime(level);
  state = 'sleep_eyes';   say(SLEEP_MSGS[Math.min(level, SLEEP_MSGS.length - 1)]); await w(5000, ok);
  state = 'sleep_laptop'; say('Close the laptop 💻');   await w(4000, ok);
  state = 'sleep_bed';    say('Good night 🛏️💤');        await w(5000, ok);
  say(null);
  await moveTo(sitX(), RUN_SPEED, ok);
}
async function music(ok) {                       // get up, dance, wander, sit again when music stops
  await moveTo(W() * 0.5 - AW / 2, RUN_SPEED, ok);
  state = 'dance';
  let since = performance.now();
  while (musicOn && !musicDismissed && musicEnabled) {
    await w(200, ok);
    if (performance.now() - since > 9000) {
      since = performance.now();
      await moveTo(20 + Math.random() * (sitX() - 20), WANDER_SPEED, ok);
      state = 'dance';
    }
  }
  await moveTo(sitX(), RUN_SPEED, ok);
}

async function alarm(ok, text) {                 // timer finished: run to middle, alarm + dance 5 s, back to sit
  musicDismissed = true;                         // don't mistake the alarm sound for music
  await moveTo(W() * 0.5 - AW / 2, RUN_SPEED, ok);
  state = 'dance'; forceDance = true; say(text); playAlarm();
  await w(ALARM_MS, ok);
  forceDance = false; stopAlarm(); say(null);
  await moveTo(sitX(), RUN_SPEED, ok);
}

function fireAlarm() {                           // called by the timer tick when time is up
  const p = pomo;
  const text = p.phase === 'study'
    ? (p.breakMin > 0 ? 'Study done! Break time ☕' : 'Study done! 🎉')
    : 'Break over! Back to it 📚';
  if (!start('alarm', 3, ok => alarm(ok, text))) return;      // busy (e.g. water reminder): try again next tick
  pomo = (p.phase === 'study' && p.breakMin > 0)              // next phase: the break, or finished
    ? { phase: 'break', endAt: Date.now() + p.breakMin * POMO_SEC_PER_MIN * 1000, breakMin: 0 }
    : null;
}

setInterval(() => {                              // timer tick: update tag, fire alarm when time is up
  if (!pomo) { tag.style.display = 'none'; return; }
  const left = pomo.endAt - Date.now();
  tag.textContent = (pomo.phase === 'study' ? '📚 ' : '☕ ') + fmt(Math.max(0, left));
  tag.style.display = 'block';
  if (panelOpen) renderPanel();
  if (left <= 0) fireAlarm();
}, 500);

setInterval(() => {                              // low battery warning
  if (!batt || batt.charging || batt.level >= LOW_BATT) return;
  if (Date.now() - lastBattWarn < BATT_REPEAT_MIN * 60000) return;
  const pct = Math.round(batt.level * 100);
  if (start('battery', 2, ok => { beepOnce(3); return notice(ok, `Charge me! 🔋 ${pct}%`, 'wave'); })) lastBattWarn = Date.now();
}, 10000);

function scheduleRemind(min) {
  clearTimeout(remindTimer);
  remindTimer = setTimeout(() => start('remind', 3, remind), min * 60000);
}
scheduleRemind(REMIND_MIN);

async function manualStreak() {                  // hover menu fire icon / tray: check GitHub right now
  if (mode !== 'idle') return;
  flash('Checking GitHub... ⏳');
  const r = await window.api.streakCheck();
  say(null);
  if (r.error) status('GitHub check failed ❌');
  else if (r.pushed) status('Commit found today ✅ Streak safe!');
  else start('streak', 2, streak);
}
$('iStreak').onclick = () => { hideMenu(); manualStreak(); };

$('yes').onclick = () => answer && answer('yes');
$('later').onclick = () => answer && answer('later');
ch.onclick = () => { if (mode === 'music' || mode === 'greet') dismissNow(); };

window.api.onCmd((name, arg) => {
  if (name === 'cursor') { cx = arg.x; cy = arg.y; }
  else if (name === 'weather') {
  start('weather', 2, ok =>
    notice(ok, arg, 'think', 6000)
  );
}
  else if (name === 'greet') start('greet', 2, greet);
  else if (name === 'remind') start('remind', 3, remind);
  else if (name === 'streak') start('streak', 2, streak);
  else if (name === 'streak-now') manualStreak();
  else if (name === 'sleep') start('sleep', 2, ok => sleepScene(ok, arg));
  else if (name === 'dismiss') dismissNow();
  else if (name === 'taskbar') tbShown = arg;     // auto-hide taskbar popped up / hid
  else if (name === 'hide-toggle') {
    hidden = !hidden;
    if (hidden) { hideMenu(); closePanel(); if (mode === 'music' || mode === 'greet') dismissNow(); }
  }
  else if (name === 'music') {
    musicEnabled = arg;
    if (!arg && mode === 'music') musicDismissed = true;
    flash(arg ? 'Music dance ON 🎵' : 'Music dance OFF 🔇');
  }
});

// ================= MOUSE: hover + when clicks should work =================
const inRect = (r, pad = 0) => cx >= r.left - pad && cx <= r.right + pad && cy >= r.top - pad && cy <= r.bottom + pad;

function syncClick() {                           // clicks ON only while the mouse is over something clickable
  if (cx === null) return;
  const els = [];
  if (bubble.style.display === 'block') els.push(bubble);
  if (menuShown) els.push(menu);
  if (panelOpen) [panel, sysPanel].forEach(p => { if (p.style.display === 'block') els.push(p); });
  let over = els.some(el => inRect(el.getBoundingClientRect(), 4));
  if (!over && (mode === 'music' || mode === 'greet') && state !== 'run') over = inRect(ch.getBoundingClientRect());
  ct(!over);
}

function hoverTick(now) {                        // hover on him for HOVER_MS => archer pose + icons
  const can = cx !== null && mode === 'idle' && !panelOpen && !hidden && (state === 'sit' || state === 'aim');
  if (!can) { hoverSince = null; leaveSince = null; if (menuShown) hideMenu(); return; }
  const cr = ch.getBoundingClientRect();
  if (!menuShown) {
    const inBody = cx >= cr.left + cr.width * 0.2 && cx <= cr.right - cr.width * 0.2 &&
                   cy >= cr.top && cy <= cr.top + cr.height * 0.65;      // upper body only (not the legs)
    if (inBody) { if (hoverSince === null) hoverSince = now; else if (now - hoverSince >= HOVER_MS) showMenu(); }
    else hoverSince = null;
  } else {
    const mr = menu.getBoundingClientRect();     // stay open while the mouse is on him or the icons
    const inside = cx >= Math.min(cr.left, mr.left) - 14 && cx <= Math.max(cr.right, mr.right) + 14 &&
                   cy >= mr.top - 14 && cy <= cr.bottom + 14;
    if (inside) leaveSince = null;
    else if (leaveSince === null) leaveSince = now;
    else if (now - leaveSince >= 600) { hideMenu(); leaveSince = null; }
  }
}
setInterval(() => { hoverTick(performance.now()); syncClick(); }, 50);

// ================= AUDIO -> music detection =================
async function startAudio() {
  const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  stream.getVideoTracks().forEach(tr => tr.stop());
  const ctx = new AudioContext();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  ctx.createMediaStreamSource(stream).connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);
  (function loop() {
    analyser.getByteFrequencyData(data);
    let bass = 0;
    for (let i = 0; i < 8; i++) bass += data[i];
    energy += (bass / 8 / 255 - energy) * 0.25;

    const now = performance.now();
    if (energy > 0.15) {
      silentSince = null; if (loudSince === null) loudSince = now;
      if (now - loudSince > 1500) musicOn = true;            // sustained sound = music
    } else {
      loudSince = null; if (silentSince === null) silentSince = now;
      if (now - silentSince > 5000) { musicOn = false; musicDismissed = false; }  // song ended
    }
    if (musicOn && musicEnabled && !musicDismissed && mode === 'idle') start('music', 1, music);
    requestAnimationFrame(loop);
  })();
}
function status(t) { say(t); setTimeout(() => { if (mode === 'idle') say(null); }, 4000); }
startAudio()
  .then(() => setTimeout(() => status('Audio OK ✅'), 5000))
  .catch(e => { console.error('audio capture failed', e); setTimeout(() => status('Audio FAILED ❌ ' + e.name), 5000); });

// ================= ANIMATION LOOP =================
const baseTarget = () => (TASKBAR_AUTOHIDE ? (tbShown ? TASKBAR_H : 0) : TB());  // ground height above screen bottom
let last = performance.now(), t = 0, lastSwap = 0, idx = 0, drop = 0, base = baseTarget();
function animate(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now; t += dt * 11;

  if (target !== null) {
    const step = speed * dt, d = target - x;
    if (Math.abs(d) <= step) { x = target; target = null; const r = resolveMove; resolveMove = null; if (r) r(); }
    else x += Math.sign(d) * step;
  }

  const e = Math.max(energy > 0.15 ? energy : 0, forceDance ? 0.6 : 0);
  let up = 0, tilt = 0, f = 1;
  if (state === 'run') {
    const frames = loaded.has('run1') && loaded.has('run2') ? ['run1', 'run2'] : ['leg_up', 'front'];
    if (now - lastSwap > 160) { idx++; lastSwap = now; }
    setImg(frames[idx % 2]); up = Math.abs(Math.sin(t * 0.8)) * 8; f = face;
  } else if (state === 'dance') {
    const list = DANCE.filter(n => loaded.has(n));
    if (now - lastSwap > 450) {                    // pick a random pose, never the same one twice in a row
      let n;
      do { n = Math.floor(Math.random() * list.length); } while (n === idx % list.length && list.length > 1);
      idx = n; lastSwap = now;
    }
    setImg(list[idx % list.length]); up = Math.abs(Math.sin(t)) * e * 20; tilt = Math.sin(t) * e * 8;
  } else if (state === 'cup') {
    if (now - lastSwap > 1200) { idx++; lastSwap = now; }
    setImg(idx % 2 ? 'cup_drink' : 'cup_hold');
  } else if (state === 'wave') setImg('hand_up');
  else if (state === 'thumb') setImg('thumbs_up');
  else if (state === 'think') setImg('think');
  else if (state === 'aim') setImg(loaded.has('archer') ? 'archer' : 'think');   // hover: archer shooting up
  else if (state === 'holdclock') setImg('clock_hold');
    else if (state === 'sleep_eyes') setImg('sleep_eyes');
  else if (state === 'sleep_laptop') setImg('sleep_laptop');
  else if (state === 'sleep_bed') setImg('sleep_bed');
  else setImg('sit');                              // idle: sitting (falls back to front.png)

  // ground follows the taskbar (rises when it pops up, sinks when it hides)
  base += (baseTarget() - base) * Math.min(1, dt * 8);

  // legs hang down when sit.png exists: over the taskbar if shown, off the screen edge if hidden
  let wantDrop = 0;
  if (state === 'sit' && loaded.has('sit')) {
    wantDrop = TASKBAR_AUTOHIDE
      ? (tbShown ? SIT_DROP : SIT_DROP_HIDDEN)
      : Math.min(SIT_DROP, Math.max(0, TB() - 4));
  }
  drop += (wantDrop - drop) * Math.min(1, dt * 10);

  actor.style.bottom = (base - drop) + 'px';
  actor.classList.toggle('sit', state === 'sit');
  actor.style.opacity = hidden && mode === 'idle' ? 0 : 1;
  ch.style.transform = `translateY(${-up}px) rotate(${tilt}deg) scaleX(${f})`;
  actor.style.transform = `translateX(${x}px)`;
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
